{% extends "base.html" %}
{% set theme = 'client' %}
{% block office %}
<h1>Create a client account</h1>
<form method="post" class="card form grid2">
  <label>Full name <input name="full_name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Password <input name="password" type="password" minlength="6" required></label>
  <label>Phone <input name="phone" placeholder="e.g. 0300-1234567"></label>
  <label>Company name <input name="company_name" placeholder="Leave empty if individual"></label>
  <label>Account type
    <select name="client_type"><option>Company</option><option>Individual</option></select></label>
  <label>Industry
    <select name="industry">{% for i in industries %}<option>{{ i }}</option>{% endfor %}</select></label>
  <label>City <input name="city" placeholder="e.g. Karachi"></label>
  <div class="wide"><button class="btn-client">Create account</button> <a href="{{ url_for('login') }}">Back</a></div>
</form>
{% endblock %}

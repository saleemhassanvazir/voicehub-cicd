{% extends "base.html" %}
{% set theme = 'actor' %}
{% block content %}
<h1>Join as a voice actor</h1>
<form method="post" class="panel form grid2">
  <label>Full name <input name="full_name" required></label>
  <label>Email <input name="email" type="email" required></label>
  <label>Password <input name="password" type="password" minlength="6" required></label>
  <label>City <input name="city" placeholder="e.g. Lahore"></label>
  <label>Gender
    <select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></label>
  <label>Voice age range
    <select name="voice_age_range">{% for a in age_ranges %}<option {{ 'selected' if a == 'Adult' }}>{{ a }}</option>{% endfor %}</select></label>
  <label>Voice style <input name="voice_style" placeholder="e.g. Deep and warm"></label>
  <label>Languages <input name="languages" required placeholder="e.g. Urdu, English"></label>
  <label>Years of experience <input name="experience_years" type="number" min="0" value="1"></label>
  <label>Rate per project (PKR) <input name="rate_pkr" type="number" min="0" step="500" value="5000"></label>
  <label class="wide">Short bio <textarea name="bio" placeholder="Tell clients about your voice and setup"></textarea></label>
  <div class="wide"><button class="btn-actor">Create account</button> <a href="{{ url_for('login') }}">Back</a></div>
</form>
{% endblock %}

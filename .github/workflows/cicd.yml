# VoiceHub CI/CD pipeline
# Code change -> git push -> security scan -> unit tests -> build -> artifact -> S3 -> deploy to EC2 -> verify live
#
# Secrets  (Settings > Secrets and variables > Actions > Secrets):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   - IAM user that can only read/write the S3 bucket
#   EC2_SSH_KEY                                 - contents of the .pem key pair file
# Variables (same page > Variables tab):
#   AWS_REGION (e.g. ap-south-1), S3_BUCKET, EC2_HOST (public IP of the EC2 server)

name: VoiceHub CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1. DevSecOps (bonus)
  security-scan:
    name: Security scan (SAST, dependencies, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: SAST - Bandit (Python code scan)
        run: bandit -r . -x ./tests,./.venv -ll

      - name: Dependency scan - pip-audit (known CVEs)
        run: pip-audit -r requirements.txt

      - name: Secret scan - Gitleaks (passwords / keys in git history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- 2. Unit tests
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: security-scan
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (pipeline stops here if any test fails)
        run: pytest -v

  # ---------------------------------------------------------------- 3. Build + artifact + S3
  build:
    name: Build and upload to S3
    runs-on: ubuntu-latest
    needs: test
    outputs:
      artifact: ${{ steps.pkg.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Package the application
        id: pkg
        run: |
          VERSION=$(cat VERSION)
          NAME="voicehub-v${VERSION}-build${{ github.run_number }}.zip"
          cat > build_info.json <<EOF
          {"build": "${{ github.run_number }}", "commit": "${{ github.sha }}", "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          zip -r "$NAME" . -x '.git/*' '.github/*' 'tests/*' '*__pycache__*' 'uploads/*' '*.zip'
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: Save build artifact in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3 and mark it as the latest successful build
        run: |
          aws s3 cp "${{ steps.pkg.outputs.name }}" "s3://${{ vars.S3_BUCKET }}/builds/${{ steps.pkg.outputs.name }}"
          echo "${{ steps.pkg.outputs.name }}" > latest.txt
          aws s3 cp latest.txt "s3://${{ vars.S3_BUCKET }}/builds/latest.txt"
          aws s3 ls "s3://${{ vars.S3_BUCKET }}/builds/"

  # ---------------------------------------------------------------- 4. Deploy latest build from S3 to EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: http://${{ vars.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find the latest successful build in S3
        id: latest
        run: |
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/builds/latest.txt" latest.txt
          NAME=$(cat latest.txt)
          # Short-lived download link, so the server never needs AWS keys
          URL=$(aws s3 presign "s3://${{ vars.S3_BUCKET }}/builds/$NAME" --expires-in 600)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deploying $NAME"

      - name: Copy deploy script to the server and run it
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ vars.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/ec2.pem deploy/deploy.sh ubuntu@"$HOST":/tmp/deploy.sh
          ssh -i ~/.ssh/ec2.pem ubuntu@"$HOST" \
            "sudo bash /tmp/deploy.sh '${{ steps.latest.outputs.url }}' '${{ steps.latest.outputs.name }}'"

  # ---------------------------------------------------------------- 5. Verify the live site
  verify:
    name: Verify live production
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Check the live website is running this build
        run: |
          EXPECTED_VERSION=$(cat VERSION)
          for i in 1 2 3 4 5 6; do
            if curl -fsS "http://${{ vars.EC2_HOST }}/health" -o health.json; then break; fi
            echo "Waiting for the site..."; sleep 5
          done
          cat health.json; echo
          python3 - "$EXPECTED_VERSION" "${{ github.run_number }}" <<'EOF'
          import json, sys
          h = json.load(open("health.json"))
          assert h["status"] == "ok", "database not reachable"
          assert h["version"] == sys.argv[1], f"live version {h['version']} != {sys.argv[1]}"
          assert str(h["build"]) == sys.argv[2], f"live build {h['build']} != {sys.argv[2]}"
          print(f"LIVE: VoiceHub v{h['version']} build {h['build']} (commit {h['commit'][:7]})")
          EOF
          curl -fsS "http://${{ vars.EC2_HOST }}/login" | grep -q "VoiceHub" && echo "Login page OK"
